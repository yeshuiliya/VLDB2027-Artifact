[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phimc"
version = "0.1.0"
description = "Sequential multi-view representation learning and clustering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "h5py>=3.8",
  "torch>=2.0",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
